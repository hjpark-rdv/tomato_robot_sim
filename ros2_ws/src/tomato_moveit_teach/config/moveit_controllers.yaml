moveit_simple_controller_manager:
  controller_names:
    - fake_ur5_controller

  fake_ur5_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      - tool_bend_joint
      - tool_gripper_z_joint
