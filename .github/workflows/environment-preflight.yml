name: Environment preflight tests
on:
  push:
    branches: [codex/mujoco-environment-preflight]
    paths:
      - 'mujoco-benchmark/scripts/environment_preflight.py'
      - 'mujoco-benchmark/scripts/audit_environment_preflight.py'
      - 'mujoco-benchmark/scripts/candidate_experiment.py'
      - 'mujoco-benchmark/tests/test_environment_preflight.py'
      - '.github/workflows/environment-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-native-distance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mujoco-version: ['3.13.0', '3.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'mujoco==${{ matrix.mujoco-version }}' 'pytest>=8,<10'
      - run: python -c "import mujoco, numpy, scipy; print('MuJoCo', mujoco.__version__, 'NumPy', numpy.__version__, 'SciPy', scipy.__version__)"
      - run: python -m pytest -v -rs mujoco-benchmark/tests/test_environment_preflight.py
      - run: python -m compileall -q mujoco-benchmark/scripts/environment_preflight.py mujoco-benchmark/scripts/audit_environment_preflight.py mujoco-benchmark/scripts/candidate_experiment.py
