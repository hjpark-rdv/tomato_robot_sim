name: Canonical start recovery regression
on:
  push:
    branches: ['codex/start-recovery-20260928']
    paths:
      - 'mujoco-benchmark/scripts/initial_configuration_recovery.py'
      - 'mujoco-benchmark/scripts/recover_initial_configuration.py'
      - 'mujoco-benchmark/scripts/materialize_new_start_run.py'
      - 'mujoco-benchmark/scripts/run_new_start_d1.py'
      - 'mujoco-benchmark/scripts/run_start_recovery_pipeline.py'
      - 'mujoco-benchmark/scripts/plan_approach_connection.py'
      - 'mujoco-benchmark/tests/test_start_recovery.py'
      - 'mujoco-benchmark/tests/test_approach_connection.py'
      - 'mujoco-benchmark/tests/test_d1_recovery.py'
      - 'mujoco-benchmark/tests/test_covered_environment_result.py'
      - 'mujoco-benchmark/tests/test_environment_preflight*.py'
      - '.github/workflows/start-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  start-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mujoco: ['3.13.0', '3.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pytest>=8,<10' 'mujoco==${{ matrix.mujoco }}' 'ompl==2.0.1'
      - name: Start recovery and existing connection regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest -v -rs --junitxml=start-recovery-tests.xml
          mujoco-benchmark/tests/test_start_recovery.py
          mujoco-benchmark/tests/test_approach_connection.py
          mujoco-benchmark/tests/test_d1_recovery.py
          mujoco-benchmark/tests/test_covered_environment_result.py
          mujoco-benchmark/tests/test_environment_preflight.py
          mujoco-benchmark/tests/test_environment_preflight_native_extended.py
          mujoco-benchmark/tests/test_environment_preflight_review.py
      - name: Reject skipped contracts
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('start-recovery-tests.xml'); assert sum(int(t.get('skipped',0)) for t in r.iter('testsuite')) == 0"
      - run: >-
          python -m compileall -q
          mujoco-benchmark/scripts/initial_configuration_recovery.py
          mujoco-benchmark/scripts/recover_initial_configuration.py
          mujoco-benchmark/scripts/materialize_new_start_run.py
          mujoco-benchmark/scripts/run_new_start_d1.py
          mujoco-benchmark/scripts/run_start_recovery_pipeline.py
