name: Multi-family search regression
on:
  push:
    branches: ['codex/multifamily-search-20260928']
    paths:
      - 'mujoco-benchmark/scripts/**'
      - 'mujoco-benchmark/tests/**'
      - '.github/workflows/motion-family-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mujoco: ['3.13.0', '3.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pytest>=8,<10' 'mujoco==${{ matrix.mujoco }}' psutil
      - run: >-
          python -m pytest -v -rs
          mujoco-benchmark/tests/test_environment_preflight.py
          mujoco-benchmark/tests/test_environment_preflight_native_extended.py
          mujoco-benchmark/tests/test_environment_preflight_review.py
          mujoco-benchmark/tests/test_contact_diagnostics.py
          mujoco-benchmark/tests/test_hook_seating_geometry.py
          mujoco-benchmark/tests/test_hook_seating_native.py
          mujoco-benchmark/tests/test_hook_seating_diversity.py
          mujoco-benchmark/tests/test_seating_timeline.py
          mujoco-benchmark/tests/test_aperture_transit.py
          mujoco-benchmark/tests/test_target_fruit_contact_trial.py
          mujoco-benchmark/tests/test_target_fruit_contact_native.py
          mujoco-benchmark/tests/test_retime_seating_trace.py
          mujoco-benchmark/tests/test_target_contact_summary.py
          mujoco-benchmark/tests/test_motion_family_search.py
          mujoco-benchmark/tests/test_search_contact_policy.py
          mujoco-benchmark/tests/test_motion_search_runner.py
      - run: python -m compileall -q mujoco-benchmark/scripts/motion_family_search.py mujoco-benchmark/scripts/run_motion_family_search.py mujoco-benchmark/scripts/target_truss_identity.py
