name: Collision-aware access planning
on:
  push:
    branches: ['codex/access-first-20260928']
    paths:
      - 'mujoco-benchmark/scripts/**'
      - 'mujoco-benchmark/tests/**'
      - '.github/workflows/access-planning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mujoco: ['3.13.0', '3.14.0']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.7.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pytest>=8,<10' 'mujoco==${{ matrix.mujoco }}' 'ompl==2.0.1' python-fcl psutil pillow imageio
      - run: python -c "import mujoco, ompl, torch, fcl; print(mujoco.__version__)"
      - run: >-
          python -m pytest -v -rs
          mujoco-benchmark/tests/test_access_route.py
          mujoco-benchmark/tests/test_access_route_native.py
          mujoco-benchmark/tests/test_access_task_bridge.py
          mujoco-benchmark/tests/test_diagnostic_pose_planner.py
          mujoco-benchmark/tests/test_environment_preflight.py
          mujoco-benchmark/tests/test_environment_preflight_native_extended.py
          mujoco-benchmark/tests/test_environment_preflight_review.py
          mujoco-benchmark/tests/test_target_fruit_contact_trial.py
          mujoco-benchmark/tests/test_target_fruit_contact_native.py
          mujoco-benchmark/tests/test_search_contact_policy.py
      - run: python -m compileall -q mujoco-benchmark/scripts/access_route.py mujoco-benchmark/scripts/plan_access_then_task.py mujoco-benchmark/scripts/prepare_access_ablation.py
