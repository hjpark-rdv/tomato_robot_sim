name: Hook seating geometry tests
on:
  push:
    branches: [codex/hook-seating-goals-20260927]
    paths:
      - 'mujoco-benchmark/scripts/hook_seating_geometry.py'
      - 'mujoco-benchmark/scripts/propose_hook_seating_goals.py'
      - 'mujoco-benchmark/tests/test_hook_seating*.py'
      - '.github/workflows/hook-seating.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-and-seating:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mujoco-version: ['3.13.0', '3.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'mujoco==${{ matrix.mujoco-version }}' 'pytest>=8,<10' psutil
      - run: python -c "import mujoco, numpy, scipy; print(mujoco.__version__, numpy.__version__, scipy.__version__)"
      - run: >-
          python -m pytest -v -rs
          mujoco-benchmark/tests/test_environment_preflight.py
          mujoco-benchmark/tests/test_environment_preflight_native_extended.py
          mujoco-benchmark/tests/test_environment_preflight_review.py
          mujoco-benchmark/tests/test_contact_diagnostics.py
          mujoco-benchmark/tests/test_hook_seating_geometry.py
          mujoco-benchmark/tests/test_hook_seating_native.py
          mujoco-benchmark/tests/test_hook_seating_diversity.py
      - run: python -m compileall -q mujoco-benchmark/scripts/hook_seating_geometry.py mujoco-benchmark/scripts/propose_hook_seating_goals.py
