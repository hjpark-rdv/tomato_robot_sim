name: Approach connection regression
on:
  push:
    branches: ['codex/approach-connection-*']
  pull_request:
    paths:
      - 'mujoco-benchmark/scripts/*approach_connection.py'
      - 'mujoco-benchmark/tests/test_approach_connection.py'
      - '.github/workflows/approach-connection.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mujoco: ['3.13.0', '3.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pytest>=8,<10' 'ompl==2.0.1' 'mujoco==${{ matrix.mujoco }}' psutil
      - run: python -c 'from ompl import base, geometric; import mujoco; print(mujoco.__version__)'
      - run: python -m pytest -v -rs mujoco-benchmark/tests/test_approach_connection.py mujoco-benchmark/tests/test_environment_preflight.py mujoco-benchmark/tests/test_search_contact_policy.py
      - run: python -m compileall -q mujoco-benchmark/scripts/approach_connection.py mujoco-benchmark/scripts/plan_approach_connection.py
