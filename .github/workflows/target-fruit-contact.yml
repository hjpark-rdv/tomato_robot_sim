name: Target fruit contact trial tests
on:
  push:
    branches: ['codex/target-fruit-contact-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-and-contact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mujoco: ['3.13.0', '3.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pytest>=8,<10' 'mujoco==${{ matrix.mujoco }}' psutil
      - run: python -c "import mujoco, numpy, scipy; print(mujoco.__version__, numpy.__version__, scipy.__version__)"
      - run: >-
          python -m pytest -v -rs
          mujoco-benchmark/tests/test_environment_preflight.py
          mujoco-benchmark/tests/test_environment_preflight_native_extended.py
          mujoco-benchmark/tests/test_environment_preflight_review.py
          mujoco-benchmark/tests/test_contact_diagnostics.py
          mujoco-benchmark/tests/test_hook_seating_geometry.py
          mujoco-benchmark/tests/test_hook_seating_native.py
          mujoco-benchmark/tests/test_hook_seating_diversity.py
          mujoco-benchmark/tests/test_seating_timeline.py
          mujoco-benchmark/tests/test_aperture_transit.py
          mujoco-benchmark/tests/test_target_fruit_contact_trial.py
          mujoco-benchmark/tests/test_target_fruit_contact_native.py
      - run: python -m compileall -q mujoco-benchmark/scripts/target_fruit_contact_trial.py
