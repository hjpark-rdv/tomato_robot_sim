name: Neighbor obstacle coverage regression
on:
  push:
    branches: ['codex/obstacle-coverage-20260928']
    paths:
      - 'mujoco-benchmark/scripts/add_neighbor_truss_obstacles.py'
      - 'mujoco-benchmark/scripts/environment_preflight.py'
      - 'mujoco-benchmark/tests/test_neighbor_obstacle_coverage.py'
      - 'mujoco-benchmark/tests/test_environment_preflight*.py'
      - 'mujoco-benchmark/tests/test_search_contact_policy.py'
      - '.github/workflows/obstacle-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mujoco: ['3.13.0', '3.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pytest>=8,<10' 'mujoco==${{ matrix.mujoco }}'
      - name: Coverage contract and environment regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest -v -rs
          mujoco-benchmark/tests/test_neighbor_obstacle_coverage.py
          mujoco-benchmark/tests/test_environment_preflight.py
          mujoco-benchmark/tests/test_environment_preflight_native_extended.py
          mujoco-benchmark/tests/test_environment_preflight_review.py
          mujoco-benchmark/tests/test_search_contact_policy.py
      - run: python -m compileall -q mujoco-benchmark/scripts/add_neighbor_truss_obstacles.py mujoco-benchmark/scripts/environment_preflight.py
