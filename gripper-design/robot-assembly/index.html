<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수확로봇 조립 · Farmily</title>
  <link rel="icon" href="data:,">
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173d33;background:#edf1f3;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;overflow:hidden}
    #viewport{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
    .panel{position:absolute;top:18px;left:18px;width:236px;background:#ffffffed;border:1px solid #d5dfdd;border-radius:12px;padding:18px;box-shadow:0 6px 24px #1c383510}
    .eyebrow{font-size:10px;letter-spacing:.15em;color:#687b75;margin:0 0 8px}h1{font-size:19px;margin:0 0 5px;letter-spacing:-.04em}.description{font-size:12px;color:#62746e;margin:0;line-height:1.6}
    .section{margin-top:19px}.label{font-size:11px;font-weight:700;color:#64776e;margin:0 0 8px}.views{display:flex;flex-wrap:wrap;gap:6px}
    button{font:inherit;font-size:12px;border:1px solid #cedbd4;color:#254b3e;background:#fff;border-radius:7px;padding:8px 10px;cursor:pointer}button:hover{background:#edf5ee}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #559269;outline-offset:2px}
    .components{display:grid;grid-template-columns:1fr 1fr;gap:10px 4px;font-size:12px}.components label{display:flex;align-items:center;gap:5px}input{accent-color:#246a48}
    #liftHeight{width:100%;margin:10px 0}#liftValue{font-size:12px;font-variant-numeric:tabular-nums}.lift-buttons{display:flex;gap:6px}
    #dimensions{font-size:11px;color:#5f716a;line-height:1.7;font-variant-numeric:tabular-nums}.note{margin-top:14px;padding-top:12px;border-top:1px solid #e4eae7;font-size:10px;line-height:1.6;color:#76847e}
    #hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;background:#ffffffdd;color:#53655e;padding:8px 12px;border-radius:20px;white-space:nowrap;pointer-events:none}
    #loading{position:absolute;inset:0;display:grid;place-items:center;background:#edf1f3e8;z-index:3}.loading-card{width:min(350px,85vw);background:#fff;padding:26px;border:1px solid #d5dfdd;border-radius:12px;text-align:center}.loading-card strong{font-size:15px}.loading-card p{font-size:12px;color:#6b7c74;line-height:1.6}progress{width:100%;height:7px;accent-color:#337b52}
    [hidden]{display:none!important}
    @media(max-width:700px){.panel{top:10px;left:10px;right:10px;width:auto;padding:12px}.eyebrow,.note,.description{display:none}h1{font-size:15px}.section{margin-top:9px}.label{display:none}.components{display:flex;flex-wrap:wrap;gap:7px 13px}button{padding:6px 9px;font-size:11px}#dimensions{margin-top:6px;font-size:10px}#hint{font-size:10px;bottom:10px;padding:6px 10px}}
  </style>
  <script type="importmap">{"imports":{"three":"/s300/vendor/three/three.module.js","three/addons/":"/s300/vendor/three/addons/"}}</script>
</head>
<body>
  <div id="viewport" aria-label="수확로봇 3D 조립 모델"></div>
  <aside class="panel" aria-label="조립 모델 보기 설정">
    <p class="eyebrow">FARMILY / HARVEST ROBOT</p>
    <h1>수확로봇 조립</h1>
    <p class="description">S300 기체 · 리프트 · RB5<br>현재 시뮬레이션의 벨트 그리퍼</p>
    <div class="section"><p class="label">시점</p><div class="views">
      <button data-view="all" disabled>전체</button><button data-view="front" disabled>정면</button><button data-view="back" disabled>후면</button><button data-view="side" disabled>측면</button><button data-view="top" disabled>위에서</button><button data-view="gripper" disabled>그리퍼 확대</button>
    </div></div>
    <div class="section"><p class="label">구성품 표시</p><div class="components">
      <label><input type="checkbox" data-component="chassis" checked disabled>S300 기체</label>
      <label><input type="checkbox" data-component="lift" checked disabled>리프트 고정부</label>
      <label><input type="checkbox" data-component="carriage" checked disabled>승강 받침대</label>
      <label><input type="checkbox" data-component="arm" checked disabled>RB5 팔</label>
      <label><input type="checkbox" data-component="gripper" checked disabled>그리퍼</label>
    </div></div>
    <div id="liftControl" class="section" hidden>
      <label for="liftHeight" id="liftValue">리프트 상승량</label>
      <input id="liftHeight" type="range" min="0" max="750" step="1" aria-label="리프트 상승량 (mm)">
      <div class="lift-buttons"><button id="liftDemo">승강 보기</button><button id="liftReset">준비 높이</button></div>
    </div>
    <div id="dimensions" class="section"></div>
    <div class="note">실제 CAD 받침대와 로봇이 함께 승강합니다.<br>높이 조절은 조립 동작 미리보기입니다.<br>장착 그리퍼: V5.1 기반 시뮬레이션 수정형.<br>별도 V6 설계는 상단 그리퍼 탭에서 확인하세요.</div>
  </aside>
  <div id="hint">드래그: 회전 · 휠/두 손가락: 확대 · 우클릭 드래그: 이동</div>
  <div id="loading" role="status" aria-live="polite"><div class="loading-card"><strong>수확로봇 조립 모델 불러오는 중</strong><p id="loadMessage">원본 부품의 형상과 색상을 준비합니다.</p><progress id="progress" max="100"></progress><button id="retry" hidden>다시 불러오기</button></div></div>
  <script type="module" src="./viewer.js?v=20261021-real-lift"></script>
</body>
</html>
